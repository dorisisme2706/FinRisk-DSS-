openapi: 3.1.0
info:
  title: FinRisk DSS Application Persistence API (M08.3 draft)
  version: 0.1.0-draft
  description: >-
    Proposal only. These routes are NOT implemented in M08.2. All write routes
    require verified authentication and owner-scoped authorization in M08.3.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /api/db/health:
    get:
      summary: Check PostgreSQL adapter connectivity (no data returned)
      responses:
        '200': { description: Connected and schema version reported }
        '503': { description: Database unavailable or schema not ready }
  /api/applications:
    get:
      summary: List applications owned/authorized for the authenticated actor
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200': { description: Paginated owner-scoped list }
        '401': { description: Authentication required }
        '403': { description: Not authorized }
    post:
      summary: Explicitly create a draft application
      description: owner_user_id is derived from authenticated identity, never accepted from request body.
      responses:
        '201': { description: Draft created and audit event appended }
        '400': { description: Invalid data contract }
        '401': { description: Authentication required }
  /api/applications/{application_id}:
    get:
      summary: Read one owner-scoped application
      parameters:
        - $ref: '#/components/parameters/applicationId'
      responses:
        '200': { description: Application DTO; PII decrypted only for authorized role }
        '404': { description: Not found or not visible to actor }
    patch:
      summary: Update draft with optimistic concurrency
      parameters:
        - $ref: '#/components/parameters/applicationId'
        - in: header
          name: If-Match
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Updated draft; row_version incremented }
        '409': { description: Version conflict }
  /api/applications/{application_id}/validation-runs:
    post:
      summary: Store technical input-quality validation; not a credit decision
      parameters:
        - $ref: '#/components/parameters/applicationId'
      responses:
        '201': { description: Validation run and findings saved }
  /api/simulations:
    post:
      summary: Explicitly save a hypothetical W04 scenario
      responses:
        '201': { description: Scenario saved with scenario_only=true }
  /api/assessment-runs:
    post:
      summary: Explicitly save a validated H18 support-signal snapshot
      description: Existing W02 profile guard runs first; test split is blocked before H18. No raw 169-vector is accepted.
      responses:
        '201': { description: H18 support snapshot stored; policy remains NOT_APPROVED }
        '403': { description: CORE4 test split is reserved/blocked }
  /api/reports:
    get:
      summary: List owner-scoped saved reports
      responses:
        '200': { description: Paginated report index }
    post:
      summary: Explicitly save sanitized W06 report payload
      responses:
        '201': { description: Report stored and audit event appended }
        '400': { description: Forbidden payload key or invalid report contract }
  /api/reports/{report_id}/archive:
    post:
      summary: Archive a report (soft state; no hard delete)
      parameters:
        - in: path
          name: report_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Report archived }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    applicationId:
      in: path
      name: application_id
      required: true
      schema: { type: string, format: uuid }
